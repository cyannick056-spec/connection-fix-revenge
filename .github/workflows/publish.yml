name: Publish Discord Performance

on:
  push:
    branches: [main]
    paths:
      - "discord-performance/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-discord-performance
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin
        run: |
          node --check discord-performance/index.js
          node -e 'JSON.parse(require("fs").readFileSync("discord-performance/manifest.json", "utf8"))'
      - name: Generate integrity hash
        run: |
          hash="$(sha256sum discord-performance/index.js | cut -d' ' -f1)"
          node -e '
            const fs = require("fs");
            const path = "discord-performance/manifest.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.hash = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          ' "$hash"
      - name: Replace published repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/discord-performance-pages
          find /tmp/discord-performance-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R discord-performance /tmp/discord-performance-pages/discord-performance
          touch /tmp/discord-performance-pages/.nojekyll
          git -C /tmp/discord-performance-pages config user.name "github-actions[bot]"
          git -C /tmp/discord-performance-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/discord-performance-pages add -A
          git -C /tmp/discord-performance-pages commit -m "Publish Discord Performance 1.0.0"
          git -C /tmp/discord-performance-pages push origin gh-pages

