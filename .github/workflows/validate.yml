# PR build validation

name: Validate

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'cli/**'
      - '.github/**'
      - 'repo.config.json'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0"

      - name: Publish Revenge plugin API locally
        run: |
          git clone --depth 1 https://github.com/revenge-mod/revenge-xposed.git /tmp/revenge-xposed
          /tmp/revenge-xposed/gradlew -p /tmp/revenge-xposed --no-daemon :api:publishToMavenLocal

      - name: Lint the workflow scripts
        run: shellcheck .github/scripts/*.sh

      - name: Build all plugins
        run: ./gradlew --no-daemon packageAllPlugins

      - name: Generate index from built artifacts
        run: |
          bun run generate-index \
            --dist build/dist \
            --base-url https://revenge.local \
            --out /tmp/index.json
          cat /tmp/index.json
